name: 整合包名称
version: 版本
java: 17
memory: 4g
port: 25565

# 自动备份由user级的crontab执行，默认关闭，方便使用自动备份模组
backup:
  enabled: false
  interval: 6h
  retain: 7

# 默认允许 src/ 被服务端修改；persistent 内容单独保存在 data/，更新整合包时不会覆盖。
# enabled: true 可启用严格只读模式，此时 persistent 同时是可写例外。
read-only:
  enabled: false
  persistent:
    - config/
    - world/
    - logs/
    - crash-reports/
    - usercache.json
    - usernamecache.json
    - banned-ips.json
    - banned-players.json
    - ops.json
    - whitelist.json
    - eula.txt
    - server.properties
