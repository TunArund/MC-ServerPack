services:
  monitor:
    build:
      context: .
    image: mc-serverpack-monitor:local
    restart: unless-stopped
    user: "${MC_CONTAINER_UID:-1000}:${MC_CONTAINER_GID:-1000}"
    env_file:
      - .env
    environment:
      MCSP_CONFIG: /app/config.yml
      MCSP_DATA: /app/data
      HOME: /tmp
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; p='/app/data/heartbeat'; raise SystemExit(not os.path.isfile(p) or time.time()-os.path.getmtime(p)>120)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
