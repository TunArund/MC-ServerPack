name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in vM.N format
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r terminal/requirements.txt
      - run: python -m unittest discover -s dev/tests -q
      - run: python dev/release/release.py check

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r terminal/requirements.txt pyinstaller
      - name: Build Linux artifacts and shared data
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          python dev/release/release.py --version "$VERSION" build all --platform linux
          python dev/release/release.py --version "$VERSION" verify
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dev/release/dist/*/mcsp-linux-x64.tar.gz
            dev/release/dist/*/mcsp-data.zip
            dev/release/dist/*/mcsp-manager.tar.gz
            dev/release/dist/*/mcsp-monitor.tar.gz

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r terminal/requirements.txt pyinstaller
      - name: Build Windows portable package
        shell: pwsh
        run: |
          $version = "${{ inputs.version || github.ref_name }}"
          New-Item -ItemType Directory -Force "dev/release/dist/$version" | Out-Null
          $data = Get-ChildItem "$env:RUNNER_TEMP/linux-release" -Recurse -Filter "mcsp-data.zip" | Select-Object -First 1
          if (-not $data) { throw "linux-release does not contain mcsp-data.zip" }
          Copy-Item $data.FullName "dev/release/dist/$version/mcsp-data.zip"
          python dev/release/release.py --version $version build platform --platform windows
          python dev/release/release.py --version $version verify
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dev/release/dist/*/mcsp-windows-x64.zip

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dev/release/collected
      - name: Assemble release metadata
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          mkdir -p "dev/release/dist/$VERSION"
          find dev/release/collected -type f -path "*/$VERSION/*" -exec cp {} "dev/release/dist/$VERSION/" \;
          python dev/release/release.py --version "$VERSION" metadata
          python dev/release/release.py --version "$VERSION" verify
      - uses: actions/upload-artifact@v4
        with:
          name: mc-serverpack-release
          path: dev/release/dist/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dev/release/dist/*/*
